<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e2e8f0"/>
    </marker>
    <marker id="arrow-cyan" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-rose" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#10b981"/>
    </marker>
    <marker id="arrow-start-cyan" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-start-rose" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto">
      <path d="M8,0 L0,4 L8,8 Z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Dark Background -->
  <rect width="800" height="600" fill="#0f172a"/>

  <!-- Title -->
  <text x="400" y="45"
        text-anchor="middle"
        font-family="sans-serif"
        font-size="24"
        font-weight="bold"
        fill="#f8fafc">
    Untethered Trackball Camera System (Orthographic)
  </text>

  <!-- 3D Coordinate Axes -->
  <line x1="400" y1="320" x2="400" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="412" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Y (Up)</text>

  <line x1="400" y1="320" x2="600" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="610" y="425" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">X</text>

  <line x1="400" y1="320" x2="200" y2="420" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="180" y="425" font-family="sans-serif" font-size="16" font-weight="bold" fill="#f8fafc">Z</text>

  <!-- Sphere Shell representing constant distance R from Focal Point T -->
  <circle cx="400" cy="320" r="184" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Parallel Focal Point Plane Indicator -->
  <ellipse cx="400" cy="320" rx="184" ry="92" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.4"/>
  <text x="500" y="270" font-family="sans-serif" font-size="13" fill="#38bdf8">Parallel Focal Plane</text>

  <!-- Rig Assembly Dolly Line (Fixed Distance R between T and E) -->
  <line x1="400" y1="320" x2="530" y2="190" stroke="#38bdf8" stroke-width="3" stroke-dasharray="8 4" marker-end="url(#arrow-cyan)"/>
  <text x="430" y="290" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" transform="rotate(-45 430 290)" dy="-6">Dolly Line</text>

  <!-- Focal Point (T) at Center -->
  <g transform="translate(400, 320)">
    <circle cx="0" cy="0" r="7" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
    <text x="18" y="-5" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Focal Point (T)</text>
  </g>

  <!-- Camera Group at E (530, 190) with Local Rotation Frame (R_rot) & Virtual Screen -->
  <g transform="translate(530, 190)">
    <!-- Camera Marker -->
    <circle cx="0" cy="0" r="10" fill="#f43f5e" stroke="#f8fafc" stroke-width="2"/>
    <text x="15" y="-5" font-family="sans-serif" font-size="18" font-weight="bold" fill="#f8fafc">Camera (E)</text>

    <!-- Local Orientation Frame (R_rot: Right, Up, Forward) representing unconstrained trackball matrix -->
    <g>
      <!-- Local Right (Rv) -->
      <line x1="0" y1="0" x2="35" y2="15" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
      <text x="40" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981">Rᵥ</text>

      <!-- Local Up (Uv) -->
      <line x1="0" y1="0" x2="0" y2="-35" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>
      <text x="5" y="-38" font-family="sans-serif" font-size="12" font-weight="bold" fill="#10b981">Uᵥ</text>
    </g>

    <!-- Virtual Screen & Screen-Oriented Pan Arrows rotated to match screen plane (-45 deg) -->
    <g transform="rotate(-45)">
      <!-- Transparent Virtual Screen Rectangle -->
      <rect x="-30" y="-45" width="60" height="90" rx="4" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="0" y="5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">Virtual Screen</text>

      <!-- Parallel View Rays -->
      <line x1="-30" y1="-30" x2="-80" y2="-30" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
      <line x1="-30" y1="30" x2="-80" y2="30" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>

      <!-- Screen X Pan Bidirectional Arrow -->
      <line x1="-35" y1="-55" x2="35" y2="-55" stroke="#f43f5e" stroke-width="2" marker-start="url(#arrow-start-rose)" marker-end="url(#arrow-rose)"/>
      <text x="0" y="-63" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f43f5e">Screen X Pan</text>

      <!-- Screen Y Pan Bidirectional Arrow -->
      <line x1="45" y1="-45" x2="45" y2="45" stroke="#f43f5e" stroke-width="2" marker-start="url(#arrow-start-rose)" marker-end="url(#arrow-rose)"/>
      <text x="60" y="5" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="bold" fill="#f43f5e" transform="rotate(90 60 5)">Screen Y Pan</text>
    </g>
  </g>

  <!-- Legend & Annotations -->
  <rect x="50" y="465" width="450" height="110" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="70" y="490" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Trackball System Mechanics:</text>
  <text x="70" y="512" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Unconstrained Rotation Matrix (Rᵴₒₜ): Zero poles / elevation clamps</text>
  <text x="70" y="532" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Rigid Assembly Dolly: Distance R between T and E stays constant</text>
  <text x="70" y="552" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Screen-Plane Panning: Focal point slides in a parallel focal plane</text>
</svg>
