<svg xmlns="http://www.w3.org/2000/svg" width="900" height="680" viewBox="0 0 900 680">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-slate" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path fill="#94a3b8" d="m0 0 8 4-8 4Z"/>
    </marker>
    <marker id="arrow-white" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path fill="#f8fafc" d="m0 0 8 4-8 4Z"/>
    </marker>
    <marker id="arrow-rv" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path fill="#10b981" d="m0 0 8 4-8 4Z"/>
    </marker>
    <marker id="arrow-uv" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path fill="#f59e0b" d="m0 0 8 4-8 4Z"/>
    </marker>
    <marker id="arrow-f" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path fill="#38bdf8" d="m0 0 8 4-8 4Z"/>
    </marker>
    <marker id="arrow-yaw" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path fill="#f59e0b" d="m0 0 8 4-8 4Z"/>
    </marker>
    <marker id="arrow-pitch" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path fill="#a855f7" d="m0 0 8 4-8 4Z"/>
    </marker>
    <marker id="arrow-pan" markerHeight="7" markerWidth="7" orient="auto" refX="6" refY="3.5">
      <path fill="#f43f5e" d="m0 0 7 3.5-7 3.5Z"/>
    </marker>
    <marker id="arrow-pan-start" markerHeight="7" markerWidth="7" orient="auto" refX="1" refY="3.5">
      <path fill="#f43f5e" d="M7 0 0 3.5 7 7Z"/>
    </marker>
    <marker id="arrow-dolly" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path fill="#38bdf8" d="m0 0 8 4-8 4Z"/>
    </marker>
    <marker id="arrow-dolly-start" markerHeight="8" markerWidth="8" orient="auto" refX="1" refY="4">
      <path fill="#38bdf8" d="M8 0 0 4l8 4Z"/>
    </marker>

    <!-- Gradients & Filters -->
    <linearGradient id="focalPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="680" fill="#0f172a"/>

  <!-- Subtle grid lines in background -->
  <g opacity="0.05" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="200" x2="900" y2="200"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="400" x2="900" y2="400"/>
    <line x1="0" y1="500" x2="900" y2="500"/>
    <line x1="150" y1="0" x2="150" y2="680"/>
    <line x1="300" y1="0" x2="300" y2="680"/>
    <line x1="450" y1="0" x2="450" y2="680"/>
    <line x1="600" y1="0" x2="600" y2="680"/>
    <line x1="750" y1="0" x2="750" y2="680"/>
  </g>

  <!-- Bounded Sphere of Rotated Camera Positions (Radius R = 302.25, 1.5x current size) -->
  <g>
    <circle cx="380" cy="360" r="302.25" fill="none" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.5" opacity="0.75"/>
    <text x="145" y="145" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-style="italic">
      Sphere of Rotation
    </text>
  </g>

  <!-- Title Header -->
  <g transform="translate(450, 36)">
    <text text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">
      Untethered Trackball Camera System — Prime Reference Frame
    </text>
    <text y="24" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500">
      Assembly Body Axes: x′ = Rᵥ (Right), y′ = Uᵥ (Up), z′ = F (Forward / Line of Sight) Anchored at Focal Point T
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- 1. PARALLEL FOCAL PLANE AT T -->
  <!-- ================================================================= -->
  <!-- Plane polygon: (275, 215) -> (545, 290) -> (485, 510) -> (215, 435) -->
  <polygon points="275,215 545,290 485,510 215,435" fill="url(#focalPlaneGrad)" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.85"/>

  <text x="240" y="235" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" opacity="0.9">
    Parallel Focal Plane (z′ = 0)
  </text>
  <text x="240" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Span: (Rᵥ, Uᵥ) ⊥ F
  </text>

  <!-- Pan 2-DOF Indicator on Focal Plane -->
  <g opacity="0.75">
    <line x1="310" y1="460" x2="430" y2="495" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" marker-start="url(#arrow-pan-start)" marker-end="url(#arrow-pan)"/>
    <text x="375" y="495" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(16 375 495)">
      Screen X Pan (along Rᵥ)
    </text>
    <line x1="255" y1="390" x2="285" y2="285" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="3 3" marker-start="url(#arrow-pan-start)" marker-end="url(#arrow-pan)"/>
    <text x="255" y="335" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-74 255 335)">
      Screen Y Pan (along Uᵥ)
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- 2. LINE OF SIGHT / DOLLY AXIS (z' / F) -->
  <!-- ================================================================= -->
  <!-- Line from Camera Eye E(570, 170) through Focal Point T(380, 360) to Scene Depth (230, 510) -->
  
  <!-- Standoff line (E to T) -->
  <line x1="570" y1="170" x2="380" y2="360" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="8 5" opacity="0.9"/>
  
  <!-- Forward extension beyond T deeper into scene -->
  <line x1="380" y1="360" x2="230" y2="510" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-f)"/>
  <text x="205" y="530" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">
    +z′ = +F (Forward / Line of Sight)
  </text>
  <text x="205" y="546" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Points deeper into scene
  </text>

  <!-- Dolly Motion Annotation -->
  <g transform="translate(490, 245) rotate(-45)">
    <line x1="-50" y1="-16" x2="50" y2="-16" stroke="#38bdf8" stroke-width="2" marker-start="url(#arrow-dolly-start)" marker-end="url(#arrow-dolly)"/>
    <text x="0" y="-24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">
      Dolly Travel: ΔD = −d·F
    </text>
    <text x="0" y="-3" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">
      Standoff Distance R (E = T − R·F)
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- 3. PRIME BODY AXES AT FOCAL POINT T(380, 360) -->
  <!-- ================================================================= -->
  
  <!-- Axis +x' / Rv (Right) -->
  <line x1="380" y1="360" x2="545" y2="406" stroke="#10b981" stroke-width="3" marker-end="url(#arrow-rv)"/>
  <g transform="translate(555, 415)">
    <text fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">+x′ = Rᵥ</text>
    <text y="16" fill="#6ee7b7" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Virtual-Screen Right</text>
  </g>

  <!-- Axis +y' / Uv (Up) -->
  <line x1="380" y1="360" x2="425" y2="195" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-uv)"/>
  <g transform="translate(432, 190)">
    <text fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">+y′ = Uᵥ</text>
    <text y="16" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Virtual-Screen Up</text>
  </g>

  <!-- Negative line of sight (-F towards Eye E) -->
  <line x1="380" y1="360" x2="460" y2="280" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="470" y="285" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-style="italic">−F (to Eye E)</text>

  <!-- ================================================================= -->
  <!-- 4. PRIME-FRAME ROTATION ARCS (θ' and φ') -->
  <!-- ================================================================= -->

  <!-- Yaw: +θ' about y' (Uv) Axis (in the Rv-F plane) -->
  <g>
    <!-- Arc from -F towards +Rv -->
    <path d="M 435 305 A 75 40 18 0 1 485 365" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-yaw)"/>
    <g transform="translate(490, 335)">
      <rect x="-6" y="-12" width="135" height="36" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" opacity="0.9"/>
      <text x="4" y="4" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">+θ′ (Yaw about y′)</text>
      <text x="4" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Shift+Right / Drag-Right</text>
    </g>
  </g>

  <!-- Pitch: +φ' about x' (Rv) Axis (in the Uv-F plane) -->
  <g>
    <!-- Arc from -F towards +Uv -->
    <path d="M 440 300 A 60 70 -45 0 0 405 245" fill="none" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrow-pitch)"/>
    <g transform="translate(325, 255)">
      <rect x="-6" y="-12" width="135" height="36" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.9"/>
      <text x="4" y="4" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">+φ′ (Pitch about x′)</text>
      <text x="4" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Shift+Up / Drag-Up</text>
    </g>
  </g>

  <!-- Focal Point Node (T) -->
  <g transform="translate(380, 360)">
    <circle r="12" fill="#0284c7" opacity="0.3" filter="url(#glow)"/>
    <circle r="8" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/>
    <text x="-15" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="end">
      Focal Point T
    </text>
    <text x="-15" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">
      (Rig Rotation Anchor)
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- 5. CAMERA EYE (E) & VIRTUAL SCREEN -->
  <!-- ================================================================= -->
  
  <!-- Virtual Screen Frame around Eye E(570, 170) -->
  <!-- Corners: (527, 80) -> (653, 115) -> (613, 260) -> (487, 225) -->
  <polygon points="527,80 653,115 613,260 487,225" fill="url(#screenGrad)" stroke="#f43f5e" stroke-width="2" rx="6"/>

  <g transform="translate(570, 120)">
    <text text-anchor="middle" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
      Virtual Screen / Image Plane
    </text>
    <text y="14" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">
      Bounded 2D Canvas Surface
    </text>
  </g>

  <!-- Screen Local Axes -->
  <g opacity="0.85">
    <line x1="570" y1="170" x2="630" y2="187" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-rv)"/>
    <text x="635" y="185" fill="#10b981" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">+x′</text>
    <line x1="570" y1="170" x2="585" y2="115" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-uv)"/>
    <text x="590" y="110" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">+y′</text>
  </g>

  <!-- Eye Node (E) -->
  <g transform="translate(570, 170)">
    <circle r="14" fill="#e11d48" opacity="0.3" filter="url(#glow)"/>
    <circle r="9" fill="#f43f5e" stroke="#f8fafc" stroke-width="2"/>
    <text x="16" y="-8" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">
      Camera Eye E
    </text>
    <text x="16" y="8" fill="#fda4af" font-family="system-ui, sans-serif" font-size="11" font-weight="600">
      E = T − R·F
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- 6. SUMMARY & MECHANICS LEGEND CARD -->
  <!-- ================================================================= -->
  <g transform="translate(40, 520)">
    <rect width="820" height="135" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Column 1: Prime Basis -->
    <g transform="translate(20, 24)">
      <text fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
        1. Prime Frame Basis (Orthonormal)
      </text>
      <text y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
        • Body basis: <tspan fill="#10b981" font-weight="bold">x′ = Rᵥ</tspan>, <tspan fill="#f59e0b" font-weight="bold">y′ = Uᵥ</tspan>, <tspan fill="#38bdf8" font-weight="bold">z′ = F</tspan>
      </text>
      <text y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
        • Right-handed: <tspan fill="#f8fafc">Rᵥ × Uᵥ = F</tspan>, <tspan fill="#f8fafc">det R_rot = +1</tspan>
      </text>
      <text y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
        • Up row stored negated: <tspan fill="#cbd5e1">R_rot = [Rᵥ; −Uᵥ; F]</tspan>
      </text>
      <text y="74" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
        • World angles (θ, Φ) are derived outputs from R_rot
      </text>
    </g>

    <!-- Column 2: Rotation Deltas -->
    <g transform="translate(290, 24)">
      <text fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
        2. Prime Rotation (Post-Multiply)
      </text>
      <text y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
        • <tspan fill="#f59e0b" font-weight="bold">Yaw (+θ′):</tspan> Rotate about body <tspan fill="#f59e0b">y′</tspan> axis (Uᵥ)
      </text>
      <text y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">
          Shift+Right / Drag-Right → <tspan fill="#f59e0b">+dYaw</tspan>
      </text>
      <text y="56" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
        • <tspan fill="#a855f7" font-weight="bold">Pitch (+φ′):</tspan> Rotate about body <tspan fill="#10b981">x′</tspan> axis (Rᵥ)
      </text>
      <text y="74" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">
          Shift+Up / Drag-Up → <tspan fill="#a855f7">+dPitch</tspan> (Coupling by design)
      </text>
    </g>

    <!-- Column 3: Pan & Dolly -->
    <g transform="translate(560, 24)">
      <text fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
        3. Panning &amp; Dollying
      </text>
      <text y="20" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
        • <tspan fill="#f43f5e" font-weight="bold">Screen Pan:</tspan> ΔT = −S·(Δx·Rᵥ + Δy·Uᵥ)
      </text>
      <text y="38" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">
          Confined to (Rᵥ, Uᵥ) plane; F · ΔT = 0
      </text>
      <text y="56" fill="#38bdf8" font-weight="bold" font-family="system-ui, sans-serif" font-size="11">
        • Dolly Magnification:
      </text>
      <text y="74" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">
          Travel along F: ΔD = −d·F; Eye E = T − R·F
      </text>
    </g>
  </g>
</svg>