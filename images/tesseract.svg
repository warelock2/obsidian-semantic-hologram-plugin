<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="n dimensions (tesseract)">
  <g fill="none" stroke="currentColor" stroke-width="2">
    <!-- outer cube -->
    <rect x="4" y="4" width="16" height="16" rx="1"/>
    <line x1="4" y1="4" x2="9" y2="9"/>
    <line x1="20" y1="4" x2="15" y2="9"/>
    <line x1="4" y1="20" x2="9" y2="15"/>
    <line x1="20" y1="20" x2="15" y2="15"/>
    <!-- inner cube (tesseract projection) -->
    <rect x="9" y="9" width="6" height="6" rx="0.5"/>
    <line x1="9" y1="9" x2="12" y2="6"/>
    <line x1="15" y1="9" x2="12" y2="6"/>
    <line x1="9" y1="15" x2="12" y2="18"/>
    <line x1="15" y1="15" x2="12" y2="18"/>
    <line x1="12" y1="6" x2="12" y2="18" stroke-dasharray="2 2"/>
  </g>
</svg>
