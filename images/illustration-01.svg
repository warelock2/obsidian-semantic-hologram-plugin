<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600"><defs><marker id="a" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#e2e8f0" d="m0 0 8 4-8 4Z"/></marker><marker id="b" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#f59e0b" d="m0 0 8 4-8 4Z"/></marker><marker id="c" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#a855f7" d="m0 0 8 4-8 4Z"/></marker><marker id="d" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#38bdf8" d="m0 0 8 4-8 4Z"/></marker><marker id="f" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#f43f5e" d="m0 0 8 4-8 4Z"/></marker><marker id="e" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#10b981" d="m0 0 8 4-8 4Z"/></marker><marker id="g" markerHeight="8" markerWidth="8" orient="auto" refX="1" refY="4"><path fill="#f43f5e" d="M8 0 0 4l8 4Z"/></marker></defs><path fill="#0f172a" d="M0 0h800v600H0z"/><text x="400" y="45" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="bold" text-anchor="middle">
    Untethered Trackball Camera System (Right-Handed, θ &amp; Φ)
  </text><path stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" d="M400 320V120"/><text x="412" y="130" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">+Y (Up, Φ = 90°)</text><path stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" d="m400 320 200 100"/><text x="610" y="425" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">+X (θ = 0°)</text><path stroke="#94a3b8" stroke-width="2" marker-end="url(#a)" d="M400 320 200 420"/><text x="180" y="425" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">+Z (Into Screen, θ = 90°)</text><path fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#b)" d="M480 360a138 138 0 0 0 30-40"/><text x="510" y="345" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold">+θ</text><path fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#c)" d="M460 350a70 70 0 0 0-60-90"/><text x="410" y="245" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold">+Φ</text><circle cx="400" cy="320" r="184" fill="none" stroke="#475569" stroke-dasharray="4 4" stroke-width="1.5"/><ellipse cx="400" cy="320" fill="none" stroke="#38bdf8" stroke-dasharray="6 6" stroke-width="1.5" opacity=".4" rx="184" ry="92"/><text x="500" y="270" fill="#38bdf8" font-family="sans-serif" font-size="13">Parallel Focal Plane</text><path stroke="#38bdf8" stroke-dasharray="8 4" stroke-width="3" marker-end="url(#d)" d="m400 320 130-130"/><text x="430" y="290" fill="#38bdf8" dy="-6" font-family="sans-serif" font-size="13" font-weight="bold" transform="rotate(-45 430 290)">Dolly Line</text><g transform="translate(400 320)"><circle r="7" fill="#38bdf8" stroke="#f8fafc" stroke-width="2"/><text x="18" y="-5" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">Focal Point (T)</text></g><g transform="translate(530 190)"><circle r="10" fill="#f43f5e" stroke="#f8fafc" stroke-width="2"/><text x="15" y="-5" fill="#f8fafc" font-family="sans-serif" font-size="18" font-weight="bold">Camera (E)</text><path stroke="#10b981" stroke-width="2" marker-end="url(#e)" d="m0 0 35 15"/><text x="40" y="20" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">Rᵥ</text><path stroke="#10b981" stroke-width="2" marker-end="url(#e)" d="M0 0v-35"/><text x="5" y="-38" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">Uᵥ</text><g transform="rotate(-45)"><rect width="60" height="90" x="-30" y="-45" fill="none" stroke="#38bdf8" stroke-width="2" rx="4"/><text y="5" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Virtual Screen</text><path stroke="#38bdf8" stroke-dasharray="2 2" d="M-30-30h-50m50 60h-50" opacity=".6"/><path stroke="#f43f5e" stroke-width="2" marker-end="url(#f)" marker-start="url(#g)" d="M-35-55h70"/><text y="-63" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Screen X Pan</text><path stroke="#f43f5e" stroke-width="2" marker-end="url(#f)" marker-start="url(#g)" d="M45-45v90"/><text x="60" y="5" fill="#f43f5e" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(90 60 5)">Screen Y Pan</text></g></g><rect width="480" height="110" x="50" y="465" fill="#1e293b" stroke="#475569" rx="6"/><text x="70" y="490" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Trackball System Mechanics (Right-Handed):</text><text x="70" y="512" fill="#cbd5e1">• Angles: θ (0° at +X, increasing to +Z) and φ (0° XZ plane, increasing to +Y)</text><text x="70" y="532" fill="#cbd5e1">• Home: θ = 90°, φ = 0° on +Z axis (modular 0°–359° range)</text><text x="70" y="552" fill="#cbd5e1">• Focal Point T as origin; Unconstrained Rotation (Rᵴₒₜ)</text></svg>